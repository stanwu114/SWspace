<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI员工协作系统</title>
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
      .loading { display: flex; align-items: center; justify-content: center; height: 100%; }
      .loading-dot { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; margin: 0 4px; animation: bounce 1.2s infinite ease-in-out; }
      .loading-dot:nth-child(2) { animation-delay: 0.15s; }
      .loading-dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
